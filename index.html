<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AMORE</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Onest:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: 'Onest', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      color: #EAF2F8;
      background:
        radial-gradient(700px 400px at 20% -10%, rgba(59,196,184,0.12), transparent 60%),
        radial-gradient(700px 500px at 110% 15%, rgba(242,193,78,0.10), transparent 55%),
        linear-gradient(160deg, #04101B 0%, #071726 60%, #04101B 100%);
    }
    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 24px;
    }
    .logo {
      width: 84px; height: 84px;
      border-radius: 26px;
      display: grid; place-items: center;
      font-family: 'Unbounded', sans-serif;
      font-weight: 800; font-size: 42px;
      color: #0a1622;
      background: linear-gradient(135deg, #F2C14E, #FF6A4D);
      box-shadow: 0 20px 50px rgba(242,193,78,0.25);
      margin-bottom: 26px;
    }
    .kicker {
      font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase;
      color: #F2C14E; font-weight: 600; margin-bottom: 14px;
    }
    h1 {
      font-family: 'Unbounded', sans-serif;
      font-size: 26px; font-weight: 700; line-height: 1.25;
      margin-bottom: 16px;
    }
    .name {
      background: linear-gradient(90deg, #F2C14E, #FF6A4D);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    p { font-size: 15px; color: #7E96A8; line-height: 1.6; max-width: 320px; }
    .badge {
      margin-top: 28px;
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 12.5px; font-weight: 600; color: #3BC4B8;
      background: rgba(59,196,184,0.1);
      border: 1px solid rgba(59,196,184,0.28);
      padding: 9px 16px; border-radius: 999px;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #3BC4B8; }
    .foot { margin-top: 40px; font-size: 11.5px; color: #46586a; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">A</div>
    <div class="kicker">Сообщество AMORE</div>
    <h1 id="greeting">Загрузка…</h1>
    <p id="subtext">Проверяем подключение…</p>
    <div class="badge"><span class="dot"></span> Приложение работает внутри Telegram</div>
    <div class="foot">Этап 1 · каркас · скоро тут появятся вакансии и база</div>
  </div>

  <script>
    (function () {
      var tg = window.Telegram ? window.Telegram.WebApp : null;
      var greeting = document.getElementById('greeting');
      var subtext = document.getElementById('subtext');

      if (tg) {
        tg.ready();
        tg.expand();
        var user = tg.initDataUnsafe && tg.initDataUnsafe.user;
        if (user && user.first_name) {
          greeting.innerHTML = 'Привет, <span class="name">' + escapeHtml(user.first_name) + '</span>!';
          subtext.textContent = 'Связка работает: приложение открылось в твоём боте и узнало, кто его открыл. Это фундамент для всего остального.';
        } else {
          greeting.innerHTML = 'Привет, <span class="name">моряк</span>!';
          subtext.textContent = 'Приложение запустилось. Имя появится, когда откроешь его через кнопку в боте.';
        }
      } else {
        greeting.innerHTML = 'Привет, <span class="name">моряк</span>!';
        subtext.textContent = 'Это страница приложения AMORE. Открывать её нужно через кнопку в твоём Telegram-боте.';
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
    })();
  </script>
</body>
</html>
